[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "somnus-eeg"
version = "1.0.5"
description = "Sleep-state scoring (Wake/NREM/REM) for mouse EEG/EMG(+video): trained model, batch scorer, review GUI, and anchored fine-tuning"
readme = "README.md"
authors = [
    { name = "Joshua Brenner", email = "joshua.brenner@hhmi.org" },
    { name = "Matthew Caudill", email = "mscaudill@gmail.com" },
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "sleep", "eeg", "emg", "polysomnography", "sleep-scoring",
    "mouse", "hmm", "machine-learning",
]
# openseize 1.3 requires 3.12+, and the feature pipeline requires openseize.
requires-python = ">=3.12"
# Floors are set a little below the versions the release was developed and
# verified against (see docs/DEVELOPMENT.md for the exact environment).
dependencies = [
    "numpy >= 2.0",
    "pandas >= 2.2",
    "scipy >= 1.14",
    "mne >= 1.8",
    "matplotlib >= 3.9",
    "openseize >= 1.3",
    "PySide6 >= 6.7",
    "opencv-python >= 4.10",
    "av >= 13.0",
    "tables >= 3.10",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine", "bumpver", "check-manifest"]

[project.urls]
Homepage = "https://github.com/joshbrenner/somnus"
Issues = "https://github.com/joshbrenner/somnus/issues"

[project.gui-scripts]
somnus-gui = "somnus.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"somnus.models" = ["*.json"]

[tool.bumpver]
current_version = "1.0.5"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = true
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"src/somnus/__init__.py" = ['__version__ = "{version}"']
